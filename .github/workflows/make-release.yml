on:
  push:
    tags:
      - v*
name: make-release
permissions: {}
jobs:
  make-release:
    name: make-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    outputs:
      kcl-version: ${{ steps.package-versions.outputs.kcl-version }}
      lib-version: ${{ steps.package-versions.outputs.lib-version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      - name: Read package versions
        id: package-versions
        run: |
          echo "kcl-version=$(jq -r '.dependencies["@kittycad/kcl-wasm-lib"]' package.json)" >> "$GITHUB_OUTPUT"
          echo "lib-version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
      - name: Build package artifacts
        run: npm install && npm run build
      - name: Publish package
        run: npm publish

  update-dependents:
    name: Update ${{ matrix.repository }} dependencies
    needs: make-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [web-view, viewer]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_ORG_APP_ID }}
          private-key: ${{ secrets.GH_ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: write

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/${{ matrix.repository }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # This guarantees all dependents have synchronized kcl-wasm-lib and kittycad.ts versions.
      - name: Update KittyCAD dependencies
        env:
          KCL_VERSION: ${{ needs.make-release.outputs.kcl-version }}
          LIB_VERSION: ${{ needs.make-release.outputs.lib-version }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          packages=("@kittycad/lib@$LIB_VERSION")
          if [[ "$REPOSITORY" == "viewer" ]]; then
            packages+=("@kittycad/kcl-wasm-lib@$KCL_VERSION")
          fi
          npm install "${packages[@]}"

      - name: Commit updated dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies"
          git push origin main
