on:
  push:
    tags: ['*']
name: make-release
permissions: {}
jobs:
  make-release:
    name: make-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Build package artifacts
        run: npm install && npm run build
      - name: Publish package
        run: npm publish

  update-dependents:
    name: Update ${{ matrix.repository }} dependencies
    needs: make-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: [web-view, viewer]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_ORG_APP_ID }}
          private-key: ${{ secrets.GH_ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
          permission-contents: write

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/${{ matrix.repository }}
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # This guarantees all dependents have synchronized kcl-wasm-lib and kittycad.ts versions.
      - name: Update kittycad.ts dependency
        env:
          LIB_VERSION: ${{ github.ref_name }}
        run: npm install "@kittycad/lib@$LIB_VERSION"

      - name: Update kcl-wasm-lib dependency
        if: matrix.repository == 'viewer'
        env:
          LIB_VERSION: ${{ github.ref_name }}
        run: |
          kcl_version="$(npm view "@kittycad/lib@$LIB_VERSION" dependencies.@kittycad/kcl-wasm-lib)"
          npm install "@kittycad/kcl-wasm-lib@$kcl_version"

      - name: Commit updated viewer dependencies
        if: matrix.repository == 'viewer'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies" \
            -m "Triggered by ${{ github.workflow }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main

      - name: Commit and release web-view dependency update
        if: matrix.repository == 'web-view'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies" \
            -m "Triggered by ${{ github.workflow }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          npm version patch --no-git-tag-version
          version="$(jq -r '.version' package.json)"
          git add package.json package-lock.json
          git commit -m "Trigger release via version bump to $version" \
            -m "Triggered by ${{ github.workflow }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin main
          git tag "$version"
          git push origin "$version"
