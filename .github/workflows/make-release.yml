on:
  push:
    branches:
      - main
name: make-release
permissions:
  id-token: write # Required for OIDC
  contents: write
jobs:
  make-release:
    name: make-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      # Only push a tag that matches the version in package.json
      - name: Tag em and bag em
        run: |
          git tag v$(cat package.json | jq -r .version)
          git push origin v$(cat package.json | jq -r .version)
      - name: Build package artifacts
        run: npm install && npm run build
      - name: Publish package
        run: npm publish

  update-web-view:
    name: Update web-view dependencies
    needs: make-release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GH_ORG_APP_ID }}
          private-key: ${{ secrets.GH_ORG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: web-view
          permission-contents: write

      - name: Checkout web-view
        uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/web-view
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Update KittyCAD dependencies
        run: npm install @kittycad/kcl-wasm-lib@latest @kittycad/lib@latest

      - name: Commit updated dependencies
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update KittyCAD web dependencies"
          git push origin main
